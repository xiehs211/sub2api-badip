name: validate-and-build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "10 2 * * *"
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Only validate the generated blocklist PR"
        required: false
        default: false
        type: boolean

concurrency:
  group: badip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate votes and build outputs
        if: github.event_name != 'pull_request'
        run: python scripts/build.py
      - name: Validate PR author and build outputs
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DIFF_BASE: origin/${{ github.base_ref }}...HEAD
        run: python scripts/build.py --check-reporter "$PR_AUTHOR" --diff-base "$DIFF_BASE"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify generated blocklist PR
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.validate_only == true)
        run: git diff --exit-code -- blocklist

  publish:
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.validate_only != true)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare generated blocklist PR
        env:
          AUTOMATION_BRANCH: automation/blocklist
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git fetch origin "$AUTOMATION_BRANCH" || true
          git switch --force-create "$AUTOMATION_BRANCH" origin/main
          python scripts/build.py
          if git diff --quiet -- blocklist; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add blocklist
          git commit -m "chore: rebuild blocklist [skip ci]"
          git push --force-with-lease origin "$AUTOMATION_BRANCH"
          if [ -z "$(gh pr list --base main --head "$AUTOMATION_BRANCH" --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create \
              --base main \
              --head "$AUTOMATION_BRANCH" \
              --title "chore: rebuild blocklist" \
              --body "Automated rebuild of derived blocklist files from the current main branch."
          fi
          gh workflow run build.yml --ref "$AUTOMATION_BRANCH" -f validate_only=true
